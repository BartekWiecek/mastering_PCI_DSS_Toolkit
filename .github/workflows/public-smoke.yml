name: Public reader delivery smoke test
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/public_smoke.py'
      - '.github/workflows/public-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-reader-smoke
  cancel-in-progress: false
jobs:
  public:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Anonymous Pages and release asset verification
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          python scripts/public_smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: public-smoke-report
          path: public-smoke-report.json
